<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for public/og-image.png (render with: npm run render:images). Fonts load from Google Fonts. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Doto:wght@900&amp;display=block');
    .display { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; }
    .led { font-family: 'Doto', ui-monospace, monospace; font-weight: 900; }
  </style>
  <defs>
    <radialGradient id="blue" cx="1" cy="0" r="0.75"><stop offset="0" stop-color="#1F52B5" stop-opacity=".32"/><stop offset="1" stop-color="#1F52B5" stop-opacity="0"/></radialGradient>
    <radialGradient id="red" cx="0" cy="1" r="0.7"><stop offset="0" stop-color="#B3123F" stop-opacity=".24"/><stop offset="1" stop-color="#B3123F" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="crest"><circle cx="112" cy="104" r="34"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0A0F19"/>
  <rect width="1200" height="630" fill="url(#blue)"/>
  <rect width="1200" height="630" fill="url(#red)"/>

  <!-- pitch markings -->
  <g fill="none" stroke="#EEF2E6" stroke-opacity=".07" stroke-width="2">
    <path d="M0 400 H1200"/><circle cx="930" cy="400" r="110"/><rect x="1010" y="120" width="190" height="200"/>
  </g>

  <!-- crest + name -->
  <circle cx="112" cy="104" r="38" fill="none" stroke="#EEF2E6" stroke-opacity=".64" stroke-width="2"/>
  <g clip-path="url(#crest)"><rect x="78" y="70" width="34" height="68" fill="#1F52B5"/><rect x="112" y="70" width="34" height="68" fill="#B3123F"/></g>
  <text x="112" y="119" text-anchor="middle" class="display" font-weight="800" font-size="44" fill="#EEF2E6">8</text>
  <text x="168" y="119" class="display" font-weight="800" font-size="46" fill="#EEF2E6">Devashish Dwivedi</text>

  <!-- LED scoreboard -->
  <rect x="818" y="72" width="306" height="62" rx="8" fill="#03060B" stroke="#1E2A3D" stroke-width="1.5"/>
  <text x="971" y="114" text-anchor="middle" class="led" font-size="27" letter-spacing="1" filter="url(#glow)"><tspan fill="#FFB627">TALK</tspan><tspan fill="#EEF2E6" dx="14">0-1</tspan><tspan fill="#FFB627" dx="14">ACTION</tspan></text>

  <!-- the pass: amber dashed route into the goal -->
  <path d="M812 548 Q850 462 930 478 Q1008 494 1016 382 Q1024 272 1090 230" fill="none" stroke="#FFB627" stroke-width="4" stroke-dasharray="12 13" stroke-linecap="round" opacity=".85"/>
  <g fill="#FFB627"><circle cx="812" cy="548" r="11"/><circle cx="930" cy="478" r="11"/><circle cx="1016" cy="382" r="11"/></g>
  <circle cx="812" cy="548" r="11" fill="none" stroke="#1F52B5" stroke-width="4"/>
  <rect x="1090" y="168" width="58" height="96" rx="2" fill="none" stroke="#EEF2E6" stroke-width="4"/>
  <path d="M1102 168V264M1114 168V264M1126 168V264M1138 168V264M1090 186H1148M1090 204H1148M1090 222H1148M1090 240H1148" stroke="#EEF2E6" stroke-opacity=".25" stroke-width="1.5"/>
  <circle cx="1112" cy="214" r="15" fill="#F4F4EE" stroke="#101410" stroke-width="2"/>
  <polygon points="1112,206 1119,211 1116,219 1108,219 1105,211" fill="#101410"/>

  <!-- the one-liner -->
  <g class="display" font-weight="900" font-size="112" fill="#EEF2E6">
    <text x="76" y="300">I play the pass</text>
    <text x="76" y="402">between the idea</text>
    <text x="76" y="504">and the goal.</text>
  </g>

  <!-- role line in LED amber -->
  <text x="80" y="572" class="led" font-size="26" letter-spacing="2" fill="#FFB627" filter="url(#glow)">AI BUILDER · GURUGRAM · AVAILABLE NOW</text>
</svg>
